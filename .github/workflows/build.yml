name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Check manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="v$(jq -r .version manifest.json)"
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json version $manifest does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build plugin
        run: |
          go mod download
          make

      - uses: actions/upload-artifact@v7
        with:
          name: playback-handoff
          path: playback-handoff.ndp
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: playback-handoff

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" playback-handoff.ndp \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
